# husky-offboard-lite — BASIS-Compose (Default = offboard/LAN): nur RViz +
# MoveIt-Plugin, kein Clearpath-Stack. Der Container joint per Zenoh den
# Graphen des ECHTEN Roboters (Entrypoint startet rmw_zenohd ->
# ROBOT_ZENOH_ENDPOINT) und bedient das dort laufende move_group grafisch.
#
# Deploy-Ziele = Basis + kleines Override (statt Vollkopien):
#   offboard/LAN:        docker compose up --build
#   AUF dem Roboter:     docker compose -f docker-compose.yml -f docker-compose.robot.yml up --build
#
#   RViz startet automatisch (command: moveit-rviz). Zusehen wahlweise
#     Browser:     http://localhost:6080/vnc.html
#     VNC-Viewer:  vnc://localhost:5900   (ohne noVNC, am Mac 'open vnc://...')
#
# Hinweis: read-only. Es wird KEIN zweites move_group und KEINE zweite
# /a200_0553/*-Quelle gestartet -> gefahrlos gegen den echten Roboter. Geplant
# wird auf dem move_group des Roboters, Execute bewegt den ECHTEN Arm (wie bei
# jeder MoveIt-Bedienung) -> nur ausfuehren, wenn der Arbeitsbereich frei ist.
#
# Ohne diesen Block laeuft der json-file-Treiber ohne Begrenzung -- auf dem
# Roboter waechst /var/lib/docker sonst unbegrenzt. 30 MB je Service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  moveit-rviz:
    logging: *logging
    build:
      context: .
      # Gemeinsames Basis-Image (siehe ../husky-offboard-base). Default = GHCR;
      # lokal mit  BASE_IMAGE=husky-offboard-base:jazzy  ueberschreibbar.
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/clairlab-haw/husky-offboard-base:jazzy}
    image: husky-offboard-lite:jazzy
    environment:
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ROBOT_ZENOH_ENDPOINT=${ROBOT_ZENOH_ENDPOINT:-tcp/10.42.42.159:7447}   # LAN-IP:Port des Roboter-Zenoh-Routers
      - ROS_DOMAIN_ID=0
      - CLEARPATH_NS=a200_0553
      # Dieses Image bestromt den Arm nicht. moveit-rviz kann den
      # Trajektorien-Controller reaktivieren und ruft dafuer
      # ur_state_manager/prepare -- das legt Energie auf die Gelenke des ECHTEN
      # Arms. lite schaut zu, es plant nicht; erst recht nicht unbeaufsichtigt
      # beim Hochfahren. Der Schalter bleibt durchgereicht, damit man ihn im
      # Bedarfsfall bewusst umlegen kann: JTC_REACTIVATE=1 docker compose up -d
      - JTC_REACTIVATE=${JTC_REACTIVATE:-0}
      # x11vnc bietet ohne Passwort nur Security-Typ "None" an -- Apples
      # Bildschirmfreigabe lehnt den ab ("Verbindung fehlgeschlagen ..."), und
      # auf dem Roboter bindet x11vnc dann an 127.0.0.1 statt 0.0.0.0. Mit
      # Passwort: Typ "VNC Auth", Bind auf allen Interfaces. Protokollgrenze
      # 8 Zeichen. noVNC auf 6080 ist davon unberuehrt (websockify geht
      # containerintern auf localhost:5900).
      - VNC_PASSWORD=${VNC_PASSWORD:-husky}
    # RViz+MoveIt direkt beim Hochfahren, statt erst xterm im noVNC-Desktop.
    # Beendet man RViz, bleibt der Container offen -> im xterm neu startbar.
    # Abschaltbar durch Override (s. docker-compose.robot.yml).
    command:
      - bash
      - -lc
      - "moveit-rviz; echo '[lite] RViz beendet -- neu starten: moveit-rviz'; exec sleep infinity"
    ports:
      # Host-Ports verschiebbar: der grosse husky-offboard-Container belegt
      # 6080 ebenfalls, beide gleichzeitig gehen nur mit NOVNC_PORT=<frei>.
      - "${NOVNC_PORT:-6080}:6080"   # noVNC (RViz im Browser)
      # Rohes VNC direkt von x11vnc (-nopw!) -- ohne noVNC/Browser. Am Mac:
      #   open vnc://localhost:5900     (Bildschirmfreigabe, kein Passwort)
      # Default-Bind ist 127.0.0.1: der Framebuffer soll nicht ungefragt im
      # Netz stehen. Von einem anderen Rechner also entweder per Tunnel
      #   ssh -f -N -L 5900:127.0.0.1:5900 <host>
      # oder bewusst oeffnen mit  VNC_BIND=0.0.0.0 docker compose up -d.
      #
      # ACHTUNG, die Verwechslung hat schon eine Fehlersuche gekostet: dieses
      # Mapping gilt NUR im Bridge-Netz. Mit docker-compose.robot.yml
      # (network_mode: host) gibt es gar kein Mapping, dann bindet x11vnc
      # selbst auf 0.0.0.0. Wer auf dem Roboter den Override vergisst, sieht
      # auf dem Host 127.0.0.1:5900 -- das ist dann der docker-proxy dieser
      # Zeile und sieht wie ein x11vnc aus, das -listen ignoriert.
      # (Wer 6080 dichtmachen will: dort ebenfalls "127.0.0.1:" voranstellen.)
      - "${VNC_BIND:-127.0.0.1}:${VNC_PORT:-5900}:5900"   # VNC (RFB) fuer einen nativen Viewer
    restart: "no"
