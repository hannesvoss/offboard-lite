# Override: Betrieb DIREKT AUF DEM ROBOTER (nicht offboard). Der Container
# teilt den Netzwerk-Stack des Roboters (host) und nutzt dessen Zenoh-Router
# auf localhost:7447 -> KEIN eigener rmw_zenohd (ZENOH_LOCAL=1).
#
#   auf dem Roboter:  docker compose -f docker-compose.yml -f docker-compose.robot.yml up --build
#   vom Laptop:       http://<robot-ip>:6080/vnc.html -> xterm -> moveit-rviz
#
# WICHTIG - CPU-Architektur: auf dem ROBOTER bauen (x86_64); ein auf
# Apple-Silicon gebautes Image laeuft dort nicht ohne buildx --platform.
# WICHTIG - Last: RViz nutzt Software-GL (llvmpipe) und konkurriert mit
# move_group/Controllern -> nur bei Bedarf starten (kein Autostart), damit die
# 125-Hz-Arm-Regelung nicht leidet.
services:
  moveit-rviz:
    network_mode: host            # Netzwerk-Stack des Roboters -> Zenoh-Router localhost:7447
    ports: !reset []              # host networking exponiert 6080 direkt (kein Mapping)
    environment:
      - ZENOH_LOCAL=1             # kein eigener Router; robot-lokalen nutzen
      - ROBOT_ZENOH_ENDPOINT=     # leer: zenoh-connect.sh nutzt ZENOH_LOCAL-Zweig
